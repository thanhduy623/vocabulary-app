<svg
  xmlns="http://www.w3.org/2000/svg"
  width="48"
  height="48"
  viewBox="0 0 48 48"
  fill="none"
>
  <defs>
    <linearGradient
      id="logoGradient"
      x1="7"
      y1="6"
      x2="42"
      y2="43"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient
      id="shineGradient"
      x1="15"
      y1="13"
      x2="35"
      y2="35"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#E9D5FF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
  </defs>

  <!-- Main geometric mark -->
  <path
    d="M24 4
       L28.1 15.9
       L40 20
       L28.1 24.1
       L24 36
       L19.9 24.1
       L8 20
       L19.9 15.9
       Z"
    fill="url(#logoGradient)"
  />

  <!-- Learning / knowledge core -->
  <path
    d="M24 13.2
       L27 20
       L34 23
       L27 26
       L24 32.8
       L21 26
       L14 23
       L21 20
       Z"
    fill="url(#shineGradient)"
  />

  <!-- Small precision node -->
  <circle
    cx="37.5"
    cy="10.5"
    r="2.5"
    fill="#06B6D4"
  />

  <!-- Connection -->
  <path
    d="M32.5 15.5L36 12"
    stroke="#67E8F9"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>